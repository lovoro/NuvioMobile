name: Build Language Learning Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/english-learning-v1
      - language-learning-v1

permissions:
  contents: read

concurrency:
  group: language-learning-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Nuvio's published client configuration. The publishable key is intended
      # for mobile clients; never put service-role or secret keys here.
      NUVIO_SUPABASE_URL: https://api.nuvio.tv
      NUVIO_SUPABASE_ANON_KEY: sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
      NUVIO_SUPABASE_FALLBACK_URL: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local build properties
        run: touch local.properties

      - name: Verify Nuvio account configuration
        run: |
          test -n "$NUVIO_SUPABASE_URL"
          test -n "$NUVIO_SUPABASE_ANON_KEY"
          echo "Nuvio backend URL is configured."
          echo "Nuvio publishable key is configured."

      - name: Build full debug APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-language-learning-debug
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
